<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title="title.trainer">Seal Fighter · 結印訓練</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <h1>Seal Fighter <small data-i18n="title.trainer">結印訓練</small>
        <a class="nav" href="index.html" data-i18n="nav.game">← 返去戰鬥</a></h1>
      <div id="lang" class="lang" role="group"></div>
    </div>
    <p id="status">…</p>
  </header>

  <main>
    <section class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="view" width="640" height="480"></canvas>
      <div class="readout">
        <div id="guess">—</div>
        <div id="confidence"></div>
        <div id="locked"></div>
      </div>
    </section>

    <aside>
      <h2><span data-i18n="trainer.heading">印</span> <span id="total"></span></h2>
      <div id="seals"></div>
      <div class="actions">
        <button id="record" disabled><span data-i18n="trainer.record">錄 30 個樣本</span> <kbd>Space</kbd></button>
        <button id="clear" data-i18n="trainer.clear">刪除呢個印嘅樣本</button>
        <button id="export" data-i18n="trainer.exportAll">匯出全部 JSON</button>
        <button id="exportMine" data-i18n="trainer.exportMine">淨係匯出我錄嘅</button>
        <label class="file"><span data-i18n="trainer.import">匯入 JSON</span> <input id="import" type="file" accept="application/json"></label>
      </div>
      <p class="tip" data-i18n="trainer.tip"></p>
    </aside>
  </main>

  <script type="module" src="src/trainer.js"></script>
</body>
</html>

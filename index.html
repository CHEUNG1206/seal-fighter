<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seal Fighter · 結印訓練</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Seal Fighter <small>結印訓練</small></h1>
    <p id="status">準備中…</p>
  </header>

  <main>
    <section class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="view" width="640" height="480"></canvas>
      <div class="readout">
        <div id="guess">—</div>
        <div id="confidence">先錄一些樣本</div>
        <div id="locked"></div>
      </div>
    </section>

    <aside>
      <h2>印 <span id="total"></span></h2>
      <div id="seals"></div>
      <div class="actions">
        <button id="record" disabled>錄 30 個樣本 <kbd>Space</kbd></button>
        <button id="clear">刪除這個印的樣本</button>
        <button id="export">匯出 JSON</button>
        <label class="file">匯入 JSON <input id="import" type="file" accept="application/json"></label>
      </div>
      <p class="tip">按鍵選印（1–9、0、-、=，「無」是 `）。每個印錄 2–3 次，每次稍微換角度、距離和左右位置。也要錄「無」，讓放鬆的手不會被誤判。</p>
    </aside>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
